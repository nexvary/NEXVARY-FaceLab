name: FaceLab Windows Android Build

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "FaceLab server URL compiled into the APK"
        required: true
        default: "http://192.168.1.107:8000"
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.12"
  FACE_API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base_url || 'http://192.168.1.107:8000' }}

jobs:
  windows-android-build:
    name: Windows • Kotlin compile • APK
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show build configuration
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_OS"
          Write-Host "FACE_API_BASE_URL=$env:FACE_API_BASE_URL"
          java -version
          python --version

      - name: Python syntax gate
        shell: pwsh
        run: |
          if (Test-Path "ai-server") {
            python -m compileall -q ai-server
          }

      - name: UI release gate
        shell: pwsh
        run: |
          if (Test-Path "qa_ui_release_gate_39000.py") {
            python qa_ui_release_gate_39000.py
          } else {
            Write-Host "UI release gate script not present; skipping."
          }

      - name: Compile Kotlin
        shell: cmd
        run: gradlew.bat --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Assemble debug APK
        shell: cmd
        run: gradlew.bat --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: pwsh
        run: |
          $apk = "app/build/outputs/apk/debug/app-debug.apk"
          if (!(Test-Path $apk)) { throw "APK was not produced: $apk" }
          $item = Get-Item $apk
          Write-Host "APK PASS: $($item.FullName) ($($item.Length) bytes)"
          Get-FileHash $apk -Algorithm SHA256 | Format-List

      - name: Upload FaceLab APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-FaceLab-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facelab-build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
