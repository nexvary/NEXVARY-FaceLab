name: FaceLab Verified Build
on:
  workflow_dispatch:
  push:
    branches: [main, development/facelab-studio]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: facelab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ai-server/requirements.txt -r ai-server/requirements-test.txt
      - run: python -m compileall -q ai-server
      - run: python -m pytest ai-server/tests -q --junitxml=python-tests.xml
      - run: python ai-server/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: python-tests.xml
          if-no-files-found: error
  android:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install pinned SDK
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, tests and lint
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: APK checksums
        shell: pwsh
        run: |
          Get-ChildItem app/build/outputs/apk -Filter *.apk -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii app/build/outputs/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: facelab-apks-${{ matrix.os }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ matrix.os }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
